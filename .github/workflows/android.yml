name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :androidApp:assembleDebug

      # Tagged releases (vX.Y.Z) are signed with the same release key as local builds,
      # so the APK attached to the GitHub Release installs over any previous version.
      - name: Build signed release APK
        id: sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RIDETRACKER_KEYSTORE_BASE64 }}
          RIDETRACKER_STOREPASSWORD: ${{ secrets.RIDETRACKER_STOREPASSWORD }}
          RIDETRACKER_KEYALIAS: ${{ secrets.RIDETRACKER_KEYALIAS }}
          RIDETRACKER_KEYPASSWORD: ${{ secrets.RIDETRACKER_KEYPASSWORD }}
        run: |
          # Without the secrets, the release APK is built and attached locally (same key), so skip here.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Release signing secrets are not set; the APK is attached from a local build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export RIDETRACKER_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew :androidApp:assembleRelease
          mv androidApp/build/outputs/apk/release/androidApp-release.apk "RideTracker-${GITHUB_REF_NAME}.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "RideTracker-${GITHUB_REF_NAME}.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "RideTracker-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
