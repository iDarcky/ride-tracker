name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :androidApp:assembleDebug

      # Tagged releases (vX.Y.Z) are signed with the same release key as local builds,
      # so the APK attached to the GitHub Release installs over any previous version.
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RIDETRACKER_KEYSTORE_BASE64 }}
          RIDETRACKER_STOREPASSWORD: ${{ secrets.RIDETRACKER_STOREPASSWORD }}
          RIDETRACKER_KEYALIAS: ${{ secrets.RIDETRACKER_KEYALIAS }}
          RIDETRACKER_KEYPASSWORD: ${{ secrets.RIDETRACKER_KEYPASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Release signing secrets are not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export RIDETRACKER_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew :androidApp:assembleRelease
          mv androidApp/build/outputs/apk/release/androidApp-release.apk "RideTracker-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "RideTracker-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
